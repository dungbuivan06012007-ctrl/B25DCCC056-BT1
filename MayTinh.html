<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài tập thực hành 2: Máy tính đơn giản</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f8;
      margin: 0;
    }

    .calculator {
      width: 320px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 20px;
    }

    #display {
      width: 100%;
      height: 60px;
      background: #222;
      color: #00ff66;
      font-size: 28px;
      text-align: right;
      padding: 12px 16px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 54px;
      font-size: 20px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #eceff1;
      color: #333;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: #cfd8dc;
    }

    button.operator {
      background-color: #ffe0b2;
      color: #e65100;
    }

    button.operator:hover {
      background-color: #ffcc80;
    }

    button.action {
      background-color: #ffcdd2;
      color: #c62828;
    }

    button.action:hover {
      background-color: #ef9a9a;
    }

    button.equals {
      background-color: #c8e6c9;
      color: #2e7d32;
    }

    button.equals:hover {
      background-color: #a5d6a7;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div id="display">0</div>

    <div class="buttons">
     
      <button class="action" id="btnClear">C</button>
      <button class="operator">/</button>
      <button class="operator">*</button>
      <button class="operator">-</button>

      <button class="number">7</button>
      <button class="number">8</button>
      <button class="number">9</button>
      <button class="operator">+</button>

     
      <button class="number">4</button>
      <button class="number">5</button>
      <button class="number">6</button>
      <button class="equals" id="btnEquals">=</button>

    
      <button class="number">1</button>
      <button class="number">2</button>
      <button class="number">3</button>
      <button class="number">0</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelectorAll('button');

    const operators = ['+', '-', '*', '/'];

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const value = btn.innerText;

       
        if (btn.id === 'btnClear') {
          display.innerText = '0';
          return;
        }

        if (btn.id === 'btnEquals') {
          calculateResult();
          return;
        }

       
        if (operators.includes(value)) {
          handleOperator(value);
          return;
        }

        handleNumber(value);
      });
    });

    function handleNumber(num) {
     
      if (display.innerText === '0' || display.innerText === 'Error') {
        display.innerText = num;
      } else {
        display.innerText += num;
      }
    }

    function handleOperator(op) {
      if (display.innerText === 'Error') {
        display.innerText = '0';
      }

      const lastChar = display.innerText.slice(-1);

      
      if (operators.includes(lastChar)) {
        display.innerText = display.innerText.slice(0, -1) + op;
      } else {
        display.innerText += op;
      }
    }

    function calculateResult() {
      const expression = display.innerText;
      const lastChar = expression.slice(-1);

     
      if (operators.includes(lastChar) || expression === 'Error') {
        return;
      }

      
      if (/\/0(?![0-9])/.test(expression)) {
        display.innerText = 'Error';
        return;
      }

      try {
        
        const result = new Function(`return ${expression}`)();
        
        
        display.innerText = Number.isFinite(result) 
          ? String(Math.round(result * 1000000) / 1000000) 
          : 'Error';
      } catch (err) {
        display.innerText = 'Error';
      }
    }
  </script>
</body>
</html>
